<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBC Test Your Level — Interactive</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:#222;line-height:1.55;background:#f2f2f2}
  .container{max-width:820px;margin:0 auto;padding:24px 16px}
  h1{color:#b80000;border-bottom:3px solid #b80000;padding-bottom:8px;font-size:24px}
  .src{color:#666;font-size:13px;margin:6px 0 20px}
  .src a{color:#b80000}
  .test-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
  .test-tab{padding:10px 24px;border:2px solid #b80000;border-radius:8px;
    cursor:pointer;font-weight:600;font-size:15px;background:#fff;color:#b80000;transition:all .15s}
  .test-tab:hover{background:#ffe5e5}
  .test-tab.active{background:#b80000;color:#fff}
  .question{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:18px 22px;
    margin:16px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .q-title{font-weight:600;margin-bottom:12px;font-size:15px}
  .opt{display:block;width:100%;padding:11px 14px;margin:6px 0;border-radius:8px;
    border:2px solid #e8e8e8;background:#fafafa;cursor:pointer;text-align:left;
    font-size:14px;transition:all .12s;line-height:1.4}
  .opt:hover{background:#f0f0f0;border-color:#ccc}
  .opt.selected{border-color:#b80000;background:#fff5f5}
  .opt.correct{background:#e6f4ea;border-color:#34a853;color:#1e7e34}
  .opt.wrong{background:#fce8e6;border-color:#ea4335;color:#c5221f}
  .opt.disabled{cursor:default;opacity:.85}
  .opt.disabled:hover{background:inherit;border-color:inherit}
  .lbl{font-weight:700;margin-right:8px;min-width:18px;display:inline-block}
  .fb{display:block;font-size:13px;color:#555;margin-top:8px;
    padding-top:8px;border-top:1px dashed #ddd;font-style:italic;line-height:1.45}
  .submit-row{text-align:center;margin:24px 0}
  .btn{padding:12px 36px;border:none;border-radius:8px;font-size:16px;
    font-weight:600;cursor:pointer;transition:all .12s;background:#b80000;color:#fff}
  .btn:hover{background:#900000}
  .btn:disabled{background:#ccc;cursor:default}
  .result{background:#fff;border:2px solid #b80000;border-radius:12px;padding:28px;
    text-align:center;margin:20px 0}
  .result h2{font-size:24px;color:#b80000}
  .result .score{font-size:48px;font-weight:800;color:#b80000;margin:8px 0;letter-spacing:-1px}
  .result .msg{font-size:16px;color:#555;margin-bottom:12px}
  .review-btn{padding:10px 24px;border:2px solid #b80000;border-radius:8px;
    color:#b80000;font-weight:600;cursor:pointer;background:#fff;margin:4px}
  .review-btn:hover{background:#ffe5e5}
  .retry-btn{padding:10px 24px;border:none;border-radius:8px;
    color:#fff;font-weight:600;cursor:pointer;background:#666;margin:4px}
  .retry-btn:hover{background:#444}
  .nav-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0 20px}
  .nav-dot{width:30px;height:30px;border-radius:50%;border:2px solid #ddd;cursor:default;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .nav-dot.correct{border-color:#34a853;color:#1e7e34;background:#e6f4ea}
  .nav-dot.wrong{border-color:#ea4335;color:#c5221f;background:#fce8e6}
  .nav-dot.current{border-color:#b80000;background:#fff5f5}
  .score-bar{height:8px;border-radius:4px;background:#eee;margin:12px auto;max-width:300px;overflow:hidden}
  .score-bar-inner{height:100%;border-radius:4px;background:#34a853;transition:width .4s}
</style>
</head>
<body>
<div class="container" id="app">
  <h1>BBC Learning English — Test Your Level</h1>
  <p class="src">Source: <a href="https://www.bbc.co.uk/learningenglish/english/course/test-your-level" target="_blank">bbc.co.uk/learningenglish</a> · select a test to begin</p>
  <div class="test-tabs" id="testTabs"></div>
  <div id="quizArea"></div>
</div>
<script>
// ====== QUIZ DATA ======
const DATA = [{"title": "Test 1 (Session 1)", "questions": [{"q": "Which of these sentences containing adverbs is correct?", "options": [["a", "I worked hardly.", "Sorry, that isn’t right. Some adverbs are irregular and do not end in ‘ly’. For example 'good' and 'fast'. 'hardly' and 'lately' exist as adverbs, but have a different meaning."], ["b", "He ran quickly.", "Well done! This sentence is correct. ‘Quickly’ is used correctly as an adverb."], ["c", "I arrived lately for the meeting.", "Sorry, that isn’t right. Some adverbs are irregular and do not end in ‘ly’, for example 'good', 'fast', 'hard' and 'late' do not change. This sentence is wrong."]], "correct": "b"}, {"q": "Which present perfect sentence is correct?", "options": [["a", "We lived in the UK since 2010.", "Sorry, that’s wrong. The present perfect can be used to describe events that started in the past and are still happening now. ’We lived’ is a completed action which is no longer happening."], ["b", "We’ve lived in the UK for 10 years.", "Well done! Present perfect sentences use ‘for’ to show how long a certain action has continued from the past into the present."], ["c", "We’ve lived in the UK since 10 years.", "Sorry, that’s wrong. In present perfect sentences, use ‘for’ to refer to a period of time (for example ’10 years’), but ‘since’ to show the point in the past when that action began, (for example. “since 2009’)."]], "correct": "b"}, {"q": "Which sentence means the speaker finds the temperature uncomfortable?", "options": [["a", "It's too hot today.", "Great job! This sentence uses ‘too’ correctly to say the heat is uncomfortable."], ["b", "It's very hot today.", "Sorry, that's not the right answer. 'Very' doesn't suggest the temperature is uncomfortable."], ["c", "It's really hot today.", "Sorry, that's not the right answer. 'Really' doesn't suggest the temperature is uncomfortable."]], "correct": "a"}, {"q": "Complete this sentence: I love the autumn because…", "options": [["a", "…the trees are too beautiful!", "Sorry, but that’s not right! Use ‘too’ to say there is a lot of something and that it is not a good thing"], ["b", "…the trees are such beautiful!", "Sorry, but that’s not right! Use ‘such’ + adjective + noun, for example They’re such beautiful trees."], ["c", "…the trees are so beautiful!", "Well done! Correct. Use so + adjective to mean ‘very’."]], "correct": "c"}, {"q": "Which of these sentences is correct?", "options": [["a", "Do we have coffee enough?", "Sorry but this this sentence is incorrect. ‘Enough’ goes before a noun to mean you have what you need (coffee)."], ["b", "Some students don’t sleep enough.", "That’s right! This sentence is OK. Use 'enough' after a verb to show you do what you need to."], ["c", "He’s not tall enough reach the top of the cupboard.", "Sorry, but this this sentence is incorrect. Sentences with adjective + enough are sometimes followed by ‘to’ + verb infinitive."]], "correct": "b"}, {"q": "Which word best fits in the space if you want to make a strong recommendation? We\\_\\_\\_\\_\\_\\_\\_\\_\\_ visit Aunt Mary soon. We haven’t seen her in years!", "options": [["a", "could", "Sorry, this is not the best word to use. ‘Could’ is used to give an option. In this sentence, the speaker wants to make a strong recommendation."], ["b", "must", "Well done! ‘Must’ is used to give a strong recommendation."], ["c", "shouldn't", "Sorry, this is not the best word to use. ‘Shouldn’t’ is used to warn someone strongly against doing something.  (Positively, ‘should’ may be used to recommend). In this sentence, the speaker wants to make a strong recommendation."]], "correct": "b"}, {"q": "Choose the correct form of the verb ‘have’ to complete the sentence: If I \\_\\_\\_\\_\\_\\_\\_\\_ enough money, I would buy a new car!", "options": [["a", "have", "Sorry, this is a common mistake. Second conditional is used to talk about imaginary situations. The ‘if clause’ uses past simple not present simple. Remember: If + subject + past simple  subject + would + verb (infinitive)."], ["b", "would have", "Sorry, this is a common mistake. Don’t use ‘would’ after ‘if’. Remember how the second conditional is formed: If + subject + past simple  subject + would + verb (infinitive)."], ["c", "had", "Good job! Second conditional is used to talk about imaginary situations. The ‘if-clause’ is formed: if + subject + past simple."]], "correct": "c"}, {"q": "Which sentence means that something isn't necessary?", "options": [["a", "You don’t have to get a taxi – the underground is really fast.", "Good job! ‘Don’t have to’ shows that something is not necessary. Use ‘don’t/doesn’t’ + ‘have to’ to form the negative."], ["b", "You haven’t to get a taxi – the underground is really fast.", "Sorry, this sentence is wrong. Use ‘don’t/doesn’t’ + ‘have to’ to form the negative, showing that something is optional or not necessary."], ["c", "You mustn’t get a taxi – the underground is really fast.", "Sorry, this sentence is wrong. ‘Mustn’t’ is used to warn someone strongly against doing something. In this sentence, the speaker wants to say that something is not necessary, so uses ‘Don’t have to’."]], "correct": "a"}, {"q": "Which sentence uses a preposition of place correctly?", "options": [["a", "I saw Helen on the supermarket today.", "Unlucky! This sentence is wrong. You can often use the prepositions ‘at’ or ‘in’ with buildings, but not usually ‘on’!"], ["b", "I saw Helen in the supermarket today.", "Well done! This sentence is correct. Use the prepositions ‘at’ or ‘in’ with buildings."], ["c", "I saw Helen with the supermarket today.", "Unlucky! This sentence is wrong. You can often use the prepositions ‘at’ or ‘in’ with buildings, but not usually ‘with’!"]], "correct": "b"}, {"q": "Which sentence uses ‘at’ correctly?", "options": [["a", "We’re leaving at 3 o’clock.", "Great job! This sentence is OK. Use the preposition ‘at’ (or ‘by’/‘before’/’after’) with o’clock times."], ["b", "Let’s meet at tomorrow.", "Sorry, this sentence is wrong. Usually, we don’t use a preposition before: today, tonight, tomorrow or yesterday (sometimes ‘by’, ‘before’ or ‘after’ can be used)."], ["c", "My birthday’s at July.", "Sorry, this sentence is wrong. Use the preposition ‘in’ before months."]], "correct": "a"}, {"q": "In which sentence does the connecting word make sense?", "options": [["a", "We arrived late at the cinema because we missed the beginning of the film.", "Sorry, this sentence doesn’t make sense. ‘Because’ is used to show the cause (‘we arrived late’) of an effect (‘we missed the beginning of the film’), so the two clauses of this sentence are in the wrong order."], ["b", "Because we arrived late at the cinema, we missed the beginning of the film.", "Well done! This sentence makes sense. ‘Because’ can be used at the start of sentence which has TWO clauses. It shows the cause (‘we arrived late’) of an effect (‘we missed the beginning of the film’)."], ["c", "We arrived late at the cinema but we missed the beginning of the film.", "Sorry, that’s wrong. In this sentence, ‘but’ is used incorrectly. Use ‘but’ to show a contrast between two things. There is no contrast between ‘we arrived late’ and ‘we missed the beginning of the film’."]], "correct": "b"}, {"q": "Choose the correct tag to complete this question: She’s got beautiful eyes, \\_\\_\\_\\_\\_\\_\\_\\_?", "options": [["a", "…aren’t they?", "Sorry, that’s wrong! The subject pronoun of the positive statement part (‘She’) stays the same in the tag part."], ["b", "…does she?", "Sorry, that’s wrong! If the statement contains an auxiliary verb, then that verb doesn’t change in the tag. In the statement, ‘She’s got beautiful eyes’, the auxiliary ‘she’s’ = ‘she has’ (got = she possesses), so we use a form of the verb 'to have' in the tag."], ["c", "...hasn’t she?", "Well done, that’s correct! The positive auxiliary verb is changed to its negative form in the tag, but the subject pronoun stays the same."]], "correct": "c"}, {"q": "Choose the correct words to complete the sentence: I went to Oxford Street \\_\\_\\_\\_\\_\\_ some new clothes.", "options": [["a", "for buy", "Sorry, that’s wrong!  We can use an infinitive (‘to buy’) to show why someone does something. The meaning is ‘in order to’ (buy new clothes)."], ["b", "to buy", "Well done! This sentence is correct. We can use the infinitive ‘to’ as another way of saying ‘in order to’."], ["c", "for buying", "Sorry, that’s wrong!  We can use an infinitive (‘to buy’) to show why someone does something. The meaning is ‘in order to’ (buy new clothes)."]], "correct": "b"}, {"q": "Choose the correct word to complete the sentence: The victim was \\_\\_\\_\\_\\_\\_\\_\\_ to hospital in an ambulance.", "options": [["a", "taking", "Sorry, that’s wrong! The passive voice is formed with the correct form of ‘to be’ + the past participle of the verb (was + taken). Passive voice is used when the object of a sentence is more important than the subject."], ["b", "took", "Sorry, that’s wrong! The passive voice is formed with the correct form of ‘to be’ + the past participle of the verb (was + taken). Passive voice is used when the object of a sentence is more important than the subject."], ["c", "taken", "That’s correct! Use the correct form of ‘to be’ + the past participle of the verb to form the passive, in this example was + taken."]], "correct": "c"}, {"q": "Change this sentence using reported speech: “There was an accident by the traffic lights this morning.”", "options": [["a", "She said there has been an accident by the traffic lights this morning.", "Sorry, that’s wrong. When reporting what someone else has said, the verb in the sentence may shift to the past tense. Past simple (‘there was an accident’) shifts to past perfect (‘there had been an accident’)."], ["b", "She said there had been an accident by the traffic lights in the morning.", "Sorry, that’s wrong!  When reporting what someone else has said, the time reference may also change (as well as the verb), for example, ‘this morning’ changes to ‘that morning’."], ["c", "She said there had been an accident by the traffic lights that morning.", "That’s correct! When reporting what someone else has said, time references may also change as well as the verb. Here, ‘this morning’ changes to ‘that morning’."]], "correct": "c"}]}, {"title": "Test 2 (Session 2)", "questions": [{"q": "Which sentence uses the present continuous correctly?", "options": [["a", "“I think you’re telling me lies. I’m not believing you!”", "Sorry, that’s wrong. Some verbs are not usually used in the continuous form. They are often verbs of thinking and feeling, for example ‘believe’."], ["b", "“I’m not checking my email. I’m studying!”", "Well done! This sentence uses the present continuous correctly to talk about activities that are in progress at the time of speaking."], ["c", "“Please explain that to me again. I’m not understanding you.”", "Sorry, that’s wrong. Some verbs are not usually used in the continuous form. They are often verbs of thinking and feeling, for example ‘understand’."]], "correct": "b"}, {"q": "“In 2017, I started studying Spanish. In 2019, I visited Spain for the first time.” Which sentence correctly describes these events?", "options": [["a", "I have been studying Spanish for two years before I first visited Spain.", "Unlucky! That’s not correct. Remember to use the past perfect continuous (had/hadn’t + been + verb -ing) when describing a situation that was happening over a period of time up to another event in the past. It is often used to give background information."], ["b", "Before I first visited Spain, I have been studying Spanish for two years.", "Unlucky! That’s not correct. Remember to use the past perfect continuous (had/hadn’t + been + verb -ing) when describing a situation that was happening over a period of time up to another event in the past. It is often used to give background information."], ["c", "I had been studying Spanish for two years before I first visited Spain.", "Yes, that’s correct! The past perfect continuous (had/hadn’t + been + verb -ing) is used correctly here to give background information about a situation that was happening in the past."]], "correct": "c"}, {"q": "Which prefix goes before 'tox' and 'crease' to create words which mean 'to remove harmful toxins' and 'to reduce'?", "options": [["a", "de-", "Well done! The correct words are ‘detox’ and ‘decrease’."], ["b", "un-", "Sorry but that’s not right. The correct words are ‘detox’ and ‘decrease’."], ["c", "dis-", "Sorry but that’s not right. The correct words are ‘detox’ and ‘decrease’."]], "correct": "a"}, {"q": "Which sentence uses ‘neither’ correctly?", "options": [["a", "Neither wallet are mine.", "Sorry but that’s wrong. After neither + noun, the verb is always singular (‘Neither wallet is mine’)."], ["b", "Neither of these wallets aren’t mine.", "Sorry but that’s wrong. After ‘neither of’, the verb is always positive (‘Neither of these wallets is mine’)."], ["c", "Neither of these wallets is mine.", "Great job! That’s correct. After ‘neither of’, the verb is always positive and can be singular (‘is’) or plural (‘are’), so ‘neither of these wallets are mine’ is also common."]], "correct": "c"}, {"q": "Which phrasal verb best fits the space in this dialogue: A: When did you \\_\\_\\_\\_\\_\\_ up with your boyfriend? B: Oh, I told him last night. I didn’t think he would \\_\\_\\_\\_\\_\\_ down in tears when I told him.", "options": [["a", "break", "Amazing! That’s correct! Here, ‘break up’ means ‘separate’ and ‘break down’ means ‘get very upset’."], ["b", "keep", "That’s not right, I’m afraid! Here ‘keep up’ can mean to maintain the same speed as someone else, but it can have other meanings too!"], ["c", "hurry", "That’s not right, I’m afraid! Here, ‘hurry up’ means telling someone to move faster."]], "correct": "a"}, {"q": "The following questions were asked at a tourist information office. Which question is correct?", "options": [["a", "Please could you give me an advice?", "I’m sorry, this is a common mistake. ‘Advice’ is an uncountable noun. It is not used with the indefinite article ‘a’ or ‘an’. It is correct to say, ‘some advice’."], ["b", "Can you give me informations about hotels?", "I’m sorry, this is a common mistake. ‘Information’ is an uncountable noun. It has no plural form. It is correct to ask for ‘some information’."], ["c", "Where can I find some accommodation?", "That’s correct! Well spotted! ‘Accommodation’ is an uncountable noun, so it is always in the singular form without the indefinite article ‘a’ or ‘an’."]], "correct": "c"}, {"q": "In this spoken sentence, what does I‘d...I‘d represent? “If I’d seen the thief, I’d have called the police.”", "options": [["a", "I would + I had", "I’m sorry but that’s wrong. This is a common mistake because 'I’d' can mean both 'I had' and 'I would'. Remember that 'I’d' in the 'if' part is 'I had', and 'I’d' in the main part is 'I would'."], ["b", "I would + I would", "I’m sorry but that’s wrong. This is a common mistake because 'I’d' can mean both 'I had' and 'I would'. Remember that 'I’d' in the 'if' part is 'I had', and 'I’d' in the main part is 'I would'."], ["c", "I had + I would", "That’s correct. Spoken third conditional sentences can be confusing. This is correct because 'I’d' in the 'if' part is 'I had', and 'I’d' in the main part is 'I would'."]], "correct": "c"}, {"q": "ALL these sentences contain the abstract uncountable noun ‘happiness’, but only ONE is correct. Which?", "options": [["a", "Money can’t buy you the happiness.", "I’m sorry, this sentence is wrong. When the abstract noun refers to a specific example (of happiness), we use ‘the’ before the noun. For example, ‘I’ll always remember the happiness she brought me’. But this is a general statement about happiness."], ["b", "Money can’t buy you happiness.", "Well done! When we use an abstract uncountable noun to make a general statement, we don’t use the articles ‘the’ or ‘a/an’."], ["c", "Money can’t buy you a happiness.", "I’m sorry but we never say ‘a happiness’. When the abstract noun refers to a specific example (of happiness), we can use ‘the’ not ‘a’ before the noun. But this is a general statement about happiness – that it can’t be bought."]], "correct": "b"}, {"q": "Which sentence is correct?", "options": [["a", "Lionel Messi is a world famous football player.", "I’m sorry but that’s not correct. Some compound adjectives, like this noun + adjective combination, need a hyphen."], ["b", "Lionel Messi is a world-famous football player.", "Well done! That’s correct. This compound adjective (noun + adjective) needs a hyphen."], ["c", "Lionel Messi is a world-famous football-player.", "Oh, you’re nearly right! Some compound adjectives, like this noun + adjective combination, need a hyphen. Football player doesn’t need a hyphen however."]], "correct": "b"}, {"q": "Your work colleague is talking on the phone, explaining why he was late this morning. Which phrase would you expect to hear?", "options": [["a", "My train was cancelled. That’s why I’m late.", "Well done! Using ‘that’s why’ to explain is very common in informal speech."], ["b", "My train was cancelled. Thus, I’m late.", "Sorry, that isn’t right. The sentence is grammatically correct but ‘thus’ is a little old-fashioned and usually written not spoken."], ["c", "My train was cancelled. Therefore, I’m late.", "Sorry, that isn’t right. The sentence is grammatically correct but ‘therefore’ is used mainly in writing or formal speech."]], "correct": "a"}, {"q": "In which sentence is the adverb placed correctly?", "options": [["a", "I was happy always at school.", "I’m sorry but that’s wrong. Second position adverbs are usually placed before the main verb, (‘He carefully opened the box’) but when the main verb is ‘to be’, the adverb usually goes immediately after the verb."], ["b", "I was always happy at school.", "Well done, that’s correct! Second position adverbs are usually placed before the main verb, (‘He carefully opened the box’) but when the main verb is ‘to be’, the adverb usually goes immediately after the verb."], ["c", "I was happy at school always.", "I’m sorry but that’s wrong. Second position adverbs are usually placed before the main verb, (‘He carefully opened the box’) but when the main verb is ‘to be’, the adverb usually goes immediately after the verb."]], "correct": "b"}, {"q": "Which reporting verb best fits the space? John\\_\\_\\_\\_\\_\\_ breaking the expensive porcelain vase.", "options": [["a", "insisted on", "Sorry that’s not the best fit! To ‘insist on’ means to demand something strongly which doesn’t fit well into this sentence."], ["b", "suggested", "Sorry that’s not the best fit! To ‘suggest’ can means to tell someone your ideas about what to do etc, which doesn’t fit well into this sentence."], ["c", "apologised for", "That’s correct. To ‘apologise for’ means to say sorry for something you have done. That fits best into this sentence."]], "correct": "c"}, {"q": "Which sentence about a timetabled event is correct?", "options": [["a", "The train will depart at 07.30 every weekday.", "Sorry, but ‘will’ is not the best choice here. ’Will’ is often used for future predictions and statements, or for instant decisions eg. ‘By 2050, all cars will be electric’ or ‘the train will depart from platform 1’."], ["b", "The train departs at 07.30 every weekday.", "Well done! That’s the best choice here. We often use the present simple to talk about timetabled events scheduled in the future."], ["c", "The train is going to depart at 07.30 every weekday.", "Sorry, but ‘going to’ is not the best choice here. ‘Going to’ is often used for a present situation that will extend into the future. For example, ‘The government is going to call an election’."]], "correct": "b"}, {"q": "Which sentence is correct in natural spoken English?", "options": [["a", "“It’s first time I’ve been to America.”", "Sorry but this doesn’t sound natural. Usually we use the definite article ‘the’ with ordinal numbers."], ["b", "“It’s my first time I’ve been to America.”", "Sorry but this sounds unnatural. You could add the definite article ‘the’ (‘It was the first time…’) or say ‘It was my first time in America’."], ["c", "“It’s the first time I’ve been to America.”", "Well done! You have remembered that we need to use ‘the’ (or a possessive) with ordinal numbers."]], "correct": "c"}, {"q": "Which sentence is correct?", "options": [["a", "“I used to cycle everywhere before I passed my driving test.”", "Well done, that’s correct! In this sentence, the speaker regularly cycled in the past but doesn’t anymore since passing her driving test. We used ‘used to + infinitive’ in these situations."], ["b", "“I’m used to cycle everywhere before I passed my driving test.”", "Sorry but that’s wrong. It’s easy to confuse ‘be used to’ and ‘used to + infinitive’. In this sentence, the speaker regularly cycled in the past but doesn’t any more since passing the driving test. ‘To be + used to’ means that something isn’t difficult for you because you are familiar with it."], ["c", "“I got used to cycle everywhere before I passed my driving test.”", "Sorry but that’s wrong. It’s easy to confuse ‘get used to’ and ‘used to + infinitive’. In this sentence, the speaker regularly cycled in the past but doesn’t any more since passing her driving test. ‘To get + used to’ means becoming familiar with something so that it is no longer difficult for you."]], "correct": "a"}]}, {"title": "Test 3 (Session 3)", "questions": [{"q": "Which sentence uses the present perfect tense correctly?", "options": [["a", "I have been to Japan last year.", "I’m sorry but this is a common mistake. We don't use the present perfect for activities in the past which are completed or finished and contain a time expression. Here, use the past simple, ‘I went to Japan last year’."], ["b", "I have lost my car keys!", "Well done, that’s correct! This sentence uses the present perfect correctly because there is a connection from the past into the present (I have lost my keys = I still don’t have them now)."], ["c", "We have got married in 2016.", "I’m sorry but this is a common mistake. We don't use the present perfect for activities in the past which are completed or finished and contain a time expression. Here, use the past simple, ‘We got married in 2016’."]], "correct": "b"}, {"q": "Which sentence uses the articles ‘a/an/the’ correctly?", "options": [["a", "I saw a fox last night. The fox was looking in the rubbish for food.", "That’s correct. Use ‘the’ before singular nouns that you have already mentioned with ‘a/an’."], ["b", "You’re a best dad ever!", "That’s incorrect! Use ‘the’ with superlatives because there is only one of them. Here, the correct sentence is, ‘You’re the best dad ever!’"], ["c", "The sugar is bad for your teeth.", "That’s incorrect! Don't use ‘the’ before plural and uncountable nouns when we are talking about things in general. Here we mean ‘sugar in general’ is bad for you."]], "correct": "a"}, {"q": "Which third conditional sentence is correct?", "options": [["a", "If you had asked me to marry you, I’d have said ‘yes’.", "Well done! That’s correct. The third conditional is formed of two parts: the 'if' part (if + past participle) and the 'imagined result' part (would have + past participle)."], ["b", "If you would have asked me to marry you, I’d have said ‘yes’.", "I’m sorry, this is a common mistake. In third conditionals, ‘would’ does not go in the If part (if + past participle). ‘Would’ goes in the other 'imagined result' part (would have + past participle). Note that in American English,  ‘would have’ may be used."], ["c", "I’d have said ‘yes’ if you would have asked me to marry you.", "I’m sorry, this is a common mistake. In third conditionals, ‘would’ does not go in the If part (if + past participle). ‘Would’ goes in the other 'imagined result' part (would have + past participle). The two parts can come in any order."]], "correct": "a"}, {"q": "‘Let’ and ‘allow’ have similar meanings, but which sentence is correct?", "options": [["a", "Her school does not let her to wear trousers.", "I’m sorry but that’s wrong. ‘Let’ is followed by a noun or object pronoun (‘her’) but takes an infinitive without ‘to’."], ["b", "Her school does not allow her wear trousers.", "I’m sorry but that’s wrong. ‘Allow’ is followed by a noun or object pronoun (‘her’) but takes an infinitive plus ‘to’."], ["c", "Her school does not allow her to wear trousers.", "Good job! That’s correct. Both ‘let’ and ‘allow’ are followed by a noun or object pronoun, but ‘allow’ takes an infinitive with ‘to’ whereas ‘let’ takes an infinitive without ‘to’."]], "correct": "c"}, {"q": "Which sentence is correct?", "options": [["a", "My brother said me that he was enjoying his new job.", "I’m sorry, that’s wrong. When we use ‘say’, we don’t usually include the object (‘me’). The correct sentence is ‘My brother said that he was enjoying his new job’ or ‘My brother told me…’"], ["b", "My brother said that he was enjoying his new job.", "Good work – that’s correct! When we use ‘say’, we don’t usually include the object (‘me’, ‘you’, ‘us’ etc)."], ["c", "My brother told that he was enjoying his new job.", "I’m sorry, that’s wrong. Sentences using ‘tell’ need an object (‘me’, ‘you’, ‘us’ etc). For example, ‘my brother told me that he was enjoying his new job’ is correct."]], "correct": "b"}, {"q": "Which sentence using ‘unless’ is correct?", "options": [["a", "What will you do unless you pass your exams?", "Good try but that’s wrong! Don’t use ‘unless’ in questions, use ‘if’ instead, for example, ‘What will you do if you don’t pass your exams?’"], ["b", "Come to the pub after work, unless you’re too tired.", "Well done! This sentence uses ‘unless’ correctly, to mean ‘if not’."], ["c", "You wouldn’t have crashed your car unless you were driving carefully.", "Good try but that’s wrong! Don’t use ‘unless’ to talk about hypothetical situations in the past. Here, use an ‘if’ conditional instead: ‘You wouldn’t have crashed your car if you were driving carefully’."]], "correct": "b"}, {"q": "Which sentence is correct?", "options": [["a", "This kitchen needs to cleaned.", "I’m sorry but that’s wrong. Use a noun + needs/s + verb-ing form to talk about something which must be done without specifying who needs to do it. Note, to be + past participle ‘this kitchen needs to be cleaned’ is also correct."], ["b", "This kitchen needs cleaning.", "Correct! Use a noun + needs/s + verb-ing form to talk about something which must be done without specifying who needs to do it. Note, to be + past participle ‘this kitchen needs to be cleaned’ is also correct."], ["c", "This kitchen needs cleaned.", "I’m sorry but that’s wrong. Use a noun + needs/s + verb-ing form to talk about something which must be done without specifying who needs to do it. Note, to be + past participle ‘this kitchen needs to be cleaned’ is also correct."]], "correct": "b"}, {"q": "Jim’s car is broken. Choose the correct adjective to complete this sentence: Jim’s old car is…", "options": [["a", "…knackered.", "Well done! It is possible to use ‘knackered’ (or ‘worn out’) when describing broken cars and machines as well as people and living things who are tired or exhausted."], ["b", "…tired.", "I’m sorry, that’s not right. It is common to use ‘tired’ for describing living things, people and animals but not cars or machines."], ["c", "…exhausted.", "I’m sorry, that’s not right. It is common to use ‘exhausted’ for describing living things, people and animals but not cars or machines."]], "correct": "a"}, {"q": "Which verb can fill ALL the gaps to make THREE correct sentences? 1. Let’s \\_\\_\\_\\_\\_\\_ away these old clothes to charity. 2. I’m trying to \\_\\_\\_\\_\\_\\_ up smoking. It’s such a bad habit! 3. You have to \\_\\_\\_\\_\\_\\_ way to oncoming traffic at this junction.", "options": [["a", "make", "I’m sorry but that’s not right. The correct verb is ‘give’. Give away’ =  donate, give to someone else; ‘give up’ = quit, stop doing something; ‘give way’ = to allow another vehicle to go first when driving."], ["b", "give", "Well done! You really know your phrasal verbs. ‘Give away’ =  donate, give to someone else; ‘give up’ = quit, stop doing something; ‘give way’ = to allow another vehicle to go first when driving."], ["c", "take", "I’m sorry but that’s not right. The correct verb is ‘give’. Give away’ =  donate, give to someone else; ‘give up’ = quit, stop doing something; ‘give way’ = to allow another vehicle to go first when driving."]], "correct": "b"}, {"q": "Which sentence using ‘wish’ is correct?", "options": [["a", "I wish I have studied for my exam.", "Unlucky, that’s wrong! Use wish + past perfect to describe past wishes or regrets."], ["b", "I wish I have had studied for my exam.", "Unlucky, that’s wrong! Use wish + past perfect to describe past wishes or regrets."], ["c", "I wish I had studied for my exam.", "Correct, well done! Use wish + past perfect to describe past wishes or regrets."]], "correct": "c"}, {"q": "Choose the correct expression to complete this sentence: Reports of hurricane winds and heavy rain are increasing. Many cities have issued \\_\\_\\_\\_\\_\\_\\_\\_\\_.", "options": [["a", "a red alert", "That’s correct! A ‘red alert’ is a warning that something dangerous will probably happen, like the arrival of a hurricane."], ["b", "a blue alert", "I’m sorry but that’s wrong. The correct expression is ‘a red alert’, meaning a warning that something dangerous will probably happen, like the arrival of a hurricane."], ["c", "a green alert", "I’m sorry but that’s wrong. The correct expression is ‘a red alert’, meaning a warning that something dangerous will probably happen, like the arrival of a hurricane."]], "correct": "a"}, {"q": "Look at the infinitive – past simple – past participle forms of the verb ‘break’: break – broke – broken. Which of the following verbs has the same rhyming pattern as ‘break’?", "options": [["a", "speak", "Well done, that’s correct. This verb forms has three forms: speak-spoke-spoken, so ‘speak’ has the same rhyming pattern as ‘break’."], ["b", "shut", "I’m sorry but that’s wrong! This verb only has one form: shut-shut-shut, similar to ‘cut’ and ‘put’."], ["c", "make", "I’m sorry but that’s wrong! This verb has two forms: make-made-made, similar to ‘find’ and ‘have’."]], "correct": "a"}, {"q": "Which expression can be used instead of ‘let’s go’, when you’re suggesting to leave somewhere together with others?", "options": [["a", "I'm off.", "Sorry, that’s not right. Use ‘I’m off’ for when you are leaving the group to go by yourself."], ["b", "Time for me to hit the road.", "Sorry, that’s not right. Use this expression when you are leaving the group to go by yourself."], ["c", "Time to make a move.", "Great job! ‘Time to make a move’ is a useful way to suggest leaving together with others. You could also say, ‘Off we go’ or ‘Shall we?’"]], "correct": "c"}, {"q": "Which sentence best uses narrative tenses to tell this story in the past?", "options": [["a", "I was relaxing on the beach when suddenly I was seeing storm clouds coming.", "I’m sorry but that’s wrong. We often use the past continuous + past simple together when one action interrupts another."], ["b", "I relaxed on the beach when suddenly I’d seen storm clouds coming.", "I’m sorry but that’s wrong. We often use the past continuous + past simple together when one action interrupts another."], ["c", "I was relaxing on the beach when suddenly I saw storm clouds coming.", "Congratulations, that’s correct! We often use the past continuous + past simple together when one action interrupts another."]], "correct": "c"}, {"q": "According to the rules of reported speech, which sentence correctly reports this question? “When is your birthday?”", "options": [["a", "He asked me when my birthday is.", "I’m sorry but that’s wrong. One step when changing from direct to indirect speech is moving the tense back. Here, ‘is’ changes to ‘was’."], ["b", "He asked me when my birthday was.", "Well done. You have remembered to follow the stages when changing from direct to indirect speech."], ["c", "He asked me when was your birthday.", "I’m sorry that’s wrong. One step when changing from direct to indirect speech is to change pronouns. In this sentence, ‘your’ changes to ‘my’, to reflect the speaker."]], "correct": "b"}]}];

let currentTest = 0;
let answers = {};
let submitted = false;
let reviewMode = false;
let feedbackVisible = false;

const quizArea = document.getElementById('quizArea');
const testTabs = document.getElementById('testTabs');

function initTabs() {
  DATA.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'test-tab' + (i === 0 ? ' active' : '');
    btn.textContent = t.title;
    btn.onclick = () => switchTest(i);
    testTabs.appendChild(btn);
  });
}

function switchTest(idx) {
  currentTest = idx;
  answers = {};
  submitted = false;
  reviewMode = false;
  feedbackVisible = false;
  document.querySelectorAll('.test-tab').forEach((el, i) => {
    el.className = 'test-tab' + (i === idx ? ' active' : '');
  });
  renderQuiz();
}

function renderQuiz() {
  const test = DATA[currentTest];
  const qs = test.questions;
  const correctAns = qs.map((_, i) => getCorrect(i));
  let html = '';

  // navigation dots
  html += '<div class="nav-dots">';
  qs.forEach((_, i) => {
    const ans = answers[i];
    let cls = 'nav-dot';
    if (submitted) cls += ans === correctAns[i] ? ' correct' : ' wrong';
    html += `<div class="${cls}">${i + 1}</div>`;
  });
  html += '</div>';

  // questions
  qs.forEach((q, i) => {
    const sel = answers[i];
    const corr = correctAns[i];
    html += `<div class="question" id="q${i}">`;
    html += `<div class="q-title">Q${i + 1}. ${esc(q.q)}</div>`;
    q.options.forEach(([letter, text, fb]) => {
      let cls = 'opt';
      let showFb = false;
      if (submitted) {
        cls += ' disabled';
        if (letter === corr) cls += ' correct';
        else if (letter === sel) cls += ' wrong';
        showFb = feedbackVisible && (letter === sel || letter === corr);
      } else {
        if (letter === sel) cls += ' selected';
      }
      const onclick = submitted ? '' : `selectOpt(${i},'${letter}')`;
      html += `<div class="${cls}" onclick="${onclick}">`;
      html += `<span class="lbl">${letter})</span>${esc(text)}`;
      if (showFb) html += `<span class="fb">${esc(fb)}</span>`;
      html += '</div>';
    });
    html += '</div>';
  });

  // submit / result
  const allAnswered = qs.every((_, i) => answers[i]);
  if (submitted) {
    const score = qs.filter((_, i) => answers[i] === correctAns[i]).length;
    const pct = Math.round(score / qs.length * 100);
    let msg = '';
    if (pct === 100) msg = 'Perfect score! Excellent work!';
    else if (pct >= 80) msg = 'Great job! Keep practising!';
    else if (pct >= 60) msg = 'Not bad — review the wrong answers below.';
    else msg = 'Keep studying! Check the explanations below.';
    html += `<div class="result">`;
    html += `<h2>${esc(test.title)} — Complete!</h2>`;
    html += `<div class="score">${score} / ${qs.length}</div>`;
    html += `<div class="score-bar"><div class="score-bar-inner" style="width:${pct}%"></div></div>`;
    html += `<div class="msg">${msg}</div>`;
    html += `<button class="review-btn" onclick="toggleReview()">${feedbackVisible ? 'Hide Explanations' : 'Show Explanations'}</button>`;
    html += `<button class="retry-btn" onclick="switchTest(${currentTest})">Retry</button>`;
    html += `</div>`;
  } else {
    html += `<div class="submit-row">`;
    html += `<button class="btn" onclick="submitQuiz()" ${allAnswered ? '' : 'disabled'}>Submit Test</button>`;
    if (!allAnswered) html += `<p style="color:#888;font-size:13px;margin-top:8px">Answer all 15 questions to submit</p>`;
    html += `</div>`;
  }

  quizArea.innerHTML = html;
}

function getCorrect(qIdx) {
  return DATA[currentTest].questions[qIdx].correct;
}

function selectOpt(qIdx, letter) {
  if (submitted) return;
  answers[qIdx] = letter;
  renderQuiz();
}

function submitQuiz() {
  submitted = true;
  feedbackVisible = true;
  renderQuiz();
}

function toggleReview() {
  feedbackVisible = !feedbackVisible;
  renderQuiz();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

initTabs();
renderQuiz();
</script>
</body>
</html>
